name: CONTENT observation gate tests
on:
  push:
    branches: [feat/content-measurement-gate-20261026]
    paths:
      - "lib/content/**"
      - "tests/content-*.test.mjs"
      - ".github/workflows/content-observation-tests.yml"
  pull_request:
    paths:
      - "lib/content/**"
      - "tests/content-*.test.mjs"
      - ".github/workflows/content-observation-tests.yml"
jobs:
  content-observation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/content-*.test.mjs
